name: 3DX Hybrid Mobile APK
on:
  push:
    branches: [main]
    paths:
      - 'tools/3dx/android-hybrid-lite/**'
      - '.github/workflows/3dx-hybrid-mobile-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: tools/3dx/android-hybrid-lite
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3DX-Hybrid-Mobile-APK-Galaxy-A11
          path: tools/3dx/android-hybrid-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
