name: Verify 3DX Both-Device Bridge Compatibility
on:
  push:
    branches: [main]
    paths:
      - 'tools/3dx/render/production.py'
      - 'tools/3dx/render/local_bridge.py'
      - 'tools/3dx/render/tests/test_local_bridge.py'
      - '.github/workflows/verify-3dx-dual-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - run: python -m unittest discover -s tools/3dx/render/tests -p test_local_bridge.py -v
