name: Build 3DX Hybrid Desktop Native WebView2
on:
  push:
    branches: [main]
    paths:
      - 'tools/3dx/windows/desktop/**'
      - 'tools/3dx/windows/hybrid_lite.py'
      - '.github/workflows/build-3dx-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build integrated Windows Desktop WebView2
        shell: pwsh
        run: dotnet publish tools/3dx/windows/desktop/HybridDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o release
      - name: Assemble 3DX desktop with official Python helper
        shell: pwsh
        run: |
          Copy-Item tools/3dx/windows/hybrid_lite.py release/hybrid_lite.py
          Copy-Item tools/3dx/windows/desktop/iniciar_3dx_desktop.cmd release/iniciar_3dx_desktop.cmd
          Copy-Item tools/3dx/windows/desktop/README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath 3DX-Hybrid-Desktop-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 3DX-Hybrid-Desktop-Windows-WebView2
          path: 3DX-Hybrid-Desktop-Windows.zip
          retention-days: 14
          if-no-files-found: error
