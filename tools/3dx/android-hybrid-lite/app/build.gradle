plugins { id 'com.android.application' }
android {
    namespace 'world.angelsnight.hybrid'
    compileSdk 35
    defaultConfig {
        applicationId 'world.angelsnight.hybrid'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
